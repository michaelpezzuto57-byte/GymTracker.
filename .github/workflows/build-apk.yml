name: Build Gym Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Extract Racing Edition Android project
        run: unzip -o GymTracker_Racing_Edition_Source.zip -d project

      - name: Configure Firebase Android SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          root = Path("project/GymTrackerNative")
          app = root / "app"
          config = Path("google-services.json")
          if not config.is_file():
              raise SystemExit("google-services.json non trovato nella root del repository")
          data = json.loads(config.read_text())
          clients = data.get("client", [])
          if not any(c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "it.gymtracker.app" for c in clients):
              raise SystemExit("google-services.json non contiene il package it.gymtracker.app")
          (app / "google-services.json").write_text(config.read_text())
          
          project_gradle = root / "build.gradle.kts"
          pg = project_gradle.read_text()
          plugin_line = '    id("com.google.gms.google-services") version "4.5.0" apply false'
          if "com.google.gms.google-services" not in pg:
              anchor = '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false'
              if anchor not in pg:
                  raise SystemExit("Plugin Kotlin Compose non trovato nel Gradle root")
              pg = pg.replace(anchor, anchor + "\n" + plugin_line, 1)
              project_gradle.write_text(pg)
          
          app_gradle = app / "build.gradle.kts"
          ag = app_gradle.read_text()
          if 'id("com.google.gms.google-services")' not in ag:
              anchor = '    id("org.jetbrains.kotlin.plugin.compose")'
              if anchor not in ag:
                  raise SystemExit("Plugin Compose non trovato nel Gradle app")
              ag = ag.replace(anchor, anchor + '\n    id("com.google.gms.google-services")', 1)
          if 'com.google.firebase:firebase-bom' not in ag:
              anchor = 'dependencies {'
              if anchor not in ag:
                  raise SystemExit("Blocco dependencies non trovato")
              deps = '''dependencies {
              implementation(platform("com.google.firebase:firebase-bom:35.1.0"))
              implementation("com.google.firebase:firebase-auth")
              implementation("com.google.firebase:firebase-firestore")'''
              ag = ag.replace(anchor, deps, 1)
          app_gradle.write_text(ag)
          project_gradle = root / "build.gradle.kts"
          pg = project_gradle.read_text()
          pg = pg.replace('version "2.0.21"', 'version "2.4.0"')
          project_gradle.write_text(pg)
          print("Firebase configurato e Kotlin aggiornato a 2.4.0: google-services.json copiato nel modulo app, plugin e SDK Auth/Firestore aggiunti.")
          PY

      - name: Inspect original app structure
        run: |
          sed -n '1,280p' project/GymTrackerNative/app/src/main/java/it/gymtracker/app/MainActivity.kt

      - name: Find Android project
        run: |
          PROJECT_DIR="project/GymTrackerNative"
          if [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Android project not found at $PROJECT_DIR"
            find project -maxdepth 4 -type f -name 'settings.gradle*' -print
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure stable APK signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/gymtracker-release.jks"
          python3 - <<'PY'
          import os, re
          value = os.environ.get("ANDROID_KEYSTORE_BASE64", "")
          compact = re.sub(r"\\s+", "", value)
          invalid = [(i, ord(ch)) for i, ch in enumerate(compact) if ch not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="]
          print(f"Keystore secret length: {len(compact)} characters")
          print(f"Invalid Base64 character count: {len(invalid)}")
          if invalid:
              print("Invalid character positions and ASCII codes:", invalid[:20])
          if len(compact) != 3712:
              print("Expected 3712 characters for the existing 2784-byte keystore.")
          PY
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          python3 - <<'PY'
          from pathlib import Path
          import os
          gradle_file = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          content = gradle_file.read_text()
          if 'create("stable")' in content:
              raise SystemExit("La configurazione stable esiste già: controllo interrotto")
          content += '''

          android {
              signingConfigs {
                  create("stable") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("stable")
                  }
              }
          }
          '''
          gradle_file.write_text(content)
          print("Firma stabile configurata per l\'APK debug.")
          PY

      - name: Align Java and Kotlin JVM targets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          gradle_file = Path(os.environ["PROJECT_DIR"]) / "app" / "build.gradle.kts"
          content = gradle_file.read_text()
          block = '''
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          '''
          if "sourceCompatibility = JavaVersion.VERSION_17" not in content:
              content = content.replace("android {", "android {\n" + block, 1)
          kotlin_block = '''
          kotlin {
              compilerOptions {
                  jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
              }
          }
          '''
          if "compilerOptions" not in content:
              content += "\n" + kotlin_block
          gradle_file.write_text(content)
          print("Java 17 and Kotlin compilerOptions JVM_17 configured in", gradle_file)
          PY

      - name: Fix invalid outer layout weights
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          content = source.read_text()
          old = "Column(Modifier.fillMaxWidth().weight(1f, fill = false))"
          count = content.count(old)
          if count != 2:
              raise SystemExit(f"Expected 2 outer weighted Columns, found {count}")
          content = content.replace(old, "Column(Modifier.fillMaxWidth())")
          old_result = "Column(Modifier.fillMaxWidth().weight(1f), horizontalAlignment = Alignment.CenterHorizontally"
          if content.count(old_result) != 1:
              raise SystemExit("Could not uniquely locate ResultScreen outer Column")
          content = content.replace(old_result, "Column(Modifier.fillMaxWidth(), horizontalAlignment = Alignment.CenterHorizontally")
          source.write_text(content)
          print("Removed invalid weight modifiers from three outer Columns")
          PY

      - name: Fix status bar overlap on Android
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          content = source.read_text()
          old = 'Column(Modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 14.dp))'
          new = 'Column(Modifier.fillMaxSize().statusBarsPadding().padding(horizontal = 16.dp, vertical = 14.dp))'
          if content.count(old) != 1:
              raise SystemExit("Could not uniquely locate main screen Column")
          source.write_text(content.replace(old, new))
          print("Applied statusBarsPadding to keep app content below the Android status bar")
          PY

      - name: Add background rest timer and notification
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, base64
          root = Path(os.environ["PROJECT_DIR"])
          source = root / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          s = source.read_text()
          s = s.replace('import android.content.Context\nimport android.os.Bundle', 'import android.content.Context\nimport android.content.Intent\nimport android.os.Build\nimport android.os.Bundle')
          s = s.replace('import androidx.activity.compose.setContent', 'import androidx.activity.compose.setContent\nimport androidx.core.content.ContextCompat')
          s = s.replace('        super.onCreate(savedInstanceState)\n        setContent { RacingGymTracker(this) }', '        super.onCreate(savedInstanceState)\n        if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(android.Manifest.permission.POST_NOTIFICATIONS), 7001)\n        setContent { RacingGymTracker(this) }')
          s = s.replace('    var seconds by remember { mutableIntStateOf(0) }\n    var timerActive by remember { mutableStateOf(false) }', '    var seconds by remember { mutableIntStateOf(0) }\n    var timerEndAt by remember { mutableLongStateOf(prefs.getLong(RestTimerService.KEY_END_AT, 0L)) }\n    var timerActive by remember { mutableStateOf(timerEndAt > System.currentTimeMillis()) }')
          import re
          new = '''    LaunchedEffect(timerEndAt) {
                  while (timerEndAt > 0L) {
                      val remaining = ((timerEndAt - System.currentTimeMillis() + 999L) / 1000L).toInt()
                      if (remaining <= 0) break
                      seconds = remaining
                      timerActive = true
                      delay(250)
                  }
                  if (timerEndAt > 0L) {
                      seconds = 0
                      timerActive = false
                      timerEndAt = 0L
                      prefs.edit().putLong(RestTimerService.KEY_END_AT, 0L).apply()
                  }
              }'''
          s, count = re.subn(r'    LaunchedEffect\(timerActive\) \{.*?\n    \}', lambda _: new, s, count=1, flags=re.S)
          if count != 1: raise SystemExit("Could not locate original timer loop")
          old = '                        if (updated[idx]) { seconds = 90; timerActive = true }'
          new = '''                        if (updated[idx]) {
                                  timerEndAt = System.currentTimeMillis() + 90_000L
                                  seconds = 90
                                  timerActive = true
                                  prefs.edit().putLong(RestTimerService.KEY_END_AT, timerEndAt).apply()
                                  val serviceIntent = Intent(context, RestTimerService::class.java).putExtra(RestTimerService.EXTRA_END_AT, timerEndAt)
                                  ContextCompat.startForegroundService(context, serviceIntent)
                                  // Start the real Android system timer without its setup screen.
                                  val systemTimerIntent = Intent(android.provider.AlarmClock.ACTION_SET_TIMER).apply {
                                      putExtra(android.provider.AlarmClock.EXTRA_LENGTH, 90)
                                      putExtra(android.provider.AlarmClock.EXTRA_MESSAGE, "Gym Tracker - Recupero")
                                      putExtra(android.provider.AlarmClock.EXTRA_SKIP_UI, true)
                                  }
                                  context.startActivity(systemTimerIntent)
                                  // Keep the user in Gym Tracker: the foreground service and in-app
                                  // countdown run the 90-second rest timer without opening Clock.

                              }'''
          if old not in s: raise SystemExit("Could not locate set-complete timer callback")
          s = s.replace(old, new)
          old = '                            timerActive = false; seconds = 0; startedAt = 0L; elapsed = 0'
          new = '''                            timerActive = false; seconds = 0; timerEndAt = 0L
                                      prefs.edit().putLong(RestTimerService.KEY_END_AT, 0L).apply()
                                      context.stopService(Intent(context, RestTimerService::class.java))
                                      startedAt = 0L; elapsed = 0'''
          if old not in s: raise SystemExit("Could not locate workout finish timer reset")
          s = s.replace(old, new)
          old = '                    }, seconds, timerActive, { timerActive = false; seconds = 0 })'
          new = '''                    }, seconds, timerActive, {
                                  timerActive = false; seconds = 0; timerEndAt = 0L
                                  prefs.edit().putLong(RestTimerService.KEY_END_AT, 0L).apply()
                                  context.stopService(Intent(context, RestTimerService::class.java))
                              })'''
          if old not in s: raise SystemExit("Could not locate stop timer callback")
          s = s.replace(old, new)
          source.write_text(s)
          service = root / "app/src/main/java/it/gymtracker/app/RestTimerService.kt"
          service.write_bytes(base64.b64decode(""))
          manifest = root / "app/src/main/AndroidManifest.xml"
          m = manifest.read_text()
          m = m.replace('<application ', '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SHORT_SERVICE" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n    <queries>\n        <intent>\n            <action android:name="android.intent.action.SET_TIMER" />\n        </intent>\n    </queries>\n    <application ')
          m = m.replace('        <activity android:name=".MainActivity"', '        <service android:name=".RestTimerService" android:exported="false" android:foregroundServiceType="shortService" />\n        <activity android:name=".MainActivity"')
          manifest.write_text(m)
          print("Background 90-second timer, ongoing countdown notification, and notification permission added")
          PY

      - name: Integrate the exact official app icon
        run: |
          python3 -m venv "$RUNNER_TEMP/photo-venv"
          "$RUNNER_TEMP/photo-venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/photo-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image
          import os, re
          root = Path(os.environ["PROJECT_DIR"])
          icon = Path("gymtracker_icon.jpg")
          if not icon.is_file():
              raise SystemExit("gymtracker_icon.jpg is missing from the repository root")
          app = root / "app/src/main"
          with Image.open(icon) as im:
              im = im.convert("RGBA")
              # Preserve the supplied artwork; only resize it for Android launcher resources.
              side = min(im.size)
              left = (im.width - side) // 2
              top = (im.height - side) // 2
              artwork = im.crop((left, top, left + side, top + side))
              for density, size in {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}.items():
                  d = app / f"res/mipmap-{density}"
                  d.mkdir(parents=True, exist_ok=True)
                  artwork.resize((size, size), Image.Resampling.LANCZOS).save(d / "ic_launcher.png")
                  artwork.resize((size, size), Image.Resampling.LANCZOS).save(d / "ic_launcher_round.png")
              # Adaptive-icon foreground uses the same artwork with transparent safe-zone padding.
              canvas = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
              fg = artwork.resize((288, 288), Image.Resampling.LANCZOS)
              canvas.alpha_composite(fg, ((432-288)//2, (432-288)//2))
              d = app / "res/drawable-nodpi"
              d.mkdir(parents=True, exist_ok=True)
              canvas.save(d / "ic_launcher_foreground.png")
          colors = app / "res/values"
          colors.mkdir(parents=True, exist_ok=True)
          (colors / "ic_launcher_background.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources><color name="ic_launcher_background">#000000</color></resources>\n'
          )
          adaptive = app / "res/mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          '''
          (adaptive / "ic_launcher.xml").write_text(xml)
          (adaptive / "ic_launcher_round.xml").write_text(xml)
          manifest = app / "AndroidManifest.xml"
          text = manifest.read_text()
          match = re.search(r"<application\b[^>]*>", text, re.S)
          if not match:
              raise SystemExit("Could not find application tag in AndroidManifest.xml")
          tag = match.group(0)
          for attr in ("icon", "roundIcon"):
              pattern = rf'\s+android:{attr}="[^"]*"'
              if re.search(pattern, tag):
                  tag = re.sub(pattern, f' android:{attr}="@mipmap/ic_launcher"', tag)
              else:
                  tag = tag[:-1] + f' android:{attr}="@mipmap/ic_launcher">'
          text = text[:match.start()] + tag + text[match.end():]
          manifest.write_text(text)
          print("Integrated gymtracker_icon.jpg as the launcher icon without redesigning the artwork")
          PY

      # Per-set weight selector: persisted independently for each exercise set.
      - name: Add per-set 5 kg weight selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          source = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          s = source.read_text()
          if "import androidx.compose.foundation.lazy.items" not in s:
              s = s.replace("import androidx.compose.foundation.lazy.LazyColumn", "import androidx.compose.foundation.lazy.LazyColumn\nimport androidx.compose.foundation.lazy.items", 1)

          old_call = '                        context.stopService(Intent(context, RestTimerService::class.java))\n                    })\n                    "STORICO"'
          new_call = '                        context.stopService(Intent(context, RestTimerService::class.java))\n                    }, prefs)\n                    "STORICO"'
          if s.count(old_call) != 1:
              raise SystemExit("Could not locate end of WorkoutScreen call")
          s = s.replace(old_call, new_call)

          old_sig = '                          finish: (Boolean) -> Unit, seconds: Int, timerActive: Boolean, stopTimer: () -> Unit)'
          new_sig = old_sig[:-1] + ', prefs: android.content.SharedPreferences)'
          if s.count(old_sig) != 1:
              raise SystemExit("Could not locate WorkoutScreen signature")
          s = s.replace(old_sig, new_sig)

          old_state = '    val startIndex = exercises.take(selected).sumOf { it.sets }\n'
          new_state = old_state + '    var weightDialogSet by remember(day, selected) { mutableIntStateOf(-1) }\n    var weightInput by remember(day, selected) { mutableStateOf("") }\n'
          if s.count(old_state) != 1:
              raise SystemExit("Could not locate exercise set index")
          s = s.replace(old_state, new_state)

          old_row = '                    Text("${ex.reps} rip.", color = Muted, fontSize = 12.sp)\n                    Spacer(Modifier.width(8.dp))\n                    Text(if (checked) "✓" else "○", color = Red, fontSize = 22.sp, fontWeight = FontWeight.Black)'
          new_row = '                    Text("${ex.reps} rip.", color = Muted, fontSize = 12.sp)\n                    Spacer(Modifier.width(5.dp))\n                    val weightKey = "weight_${day}_${selected}_${s}"\n                    val savedWeight = prefs.getString(weightKey, "") ?: ""\n                    Box(Modifier.clip(RoundedCornerShape(8.dp)).background(Color(0xFF3A0A10)).border(1.dp, Red, RoundedCornerShape(8.dp)).clickable { weightDialogSet = s; weightInput = savedWeight }.padding(horizontal = 12.dp, vertical = 8.dp)) {\n                        Text(if (savedWeight.isNotBlank()) "${savedWeight} kg" else "＋ PESO", color = White, fontWeight = FontWeight.Black, fontSize = 12.sp)\n                    }\n                    Spacer(Modifier.width(3.dp))\n                    Text(if (checked) "✓" else "○", color = Red, fontSize = 22.sp, fontWeight = FontWeight.Black)'
          if s.count(old_row) != 1:
              raise SystemExit("Could not locate set row")
          s = s.replace(old_row, new_row)

          old_after = '            }\n        }\n        if (timerActive && seconds > 0) {'
          new_after = "            }\n        }\n        if (weightDialogSet >= 0) {\n            val chosenSet = weightDialogSet\n            AlertDialog(\n                onDismissRequest = { weightDialogSet = -1 },\n                title = { Text(\"PESO • SERIE ${chosenSet + 1}\", color = White, fontWeight = FontWeight.Black) },\n                text = {\n                    Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {\n                        Text(\"INSERISCI IL CARICO USATO\", color = Muted, fontSize = 11.sp, fontWeight = FontWeight.Bold)\n                        androidx.compose.material3.OutlinedTextField(\n                            value = weightInput,\n                            onValueChange = { value -> weightInput = value.filter { it.isDigit() || it == '.' || it == ',' } },\n                            singleLine = true,\n                            label = { Text(\"Peso in kg\", color = Muted) },\n                            keyboardOptions = androidx.compose.foundation.text.KeyboardOptions(keyboardType = androidx.compose.ui.text.input.KeyboardType.Decimal),\n                            modifier = Modifier.fillMaxWidth(),\n                            colors = androidx.compose.material3.OutlinedTextFieldDefaults.colors(\n                                focusedTextColor = White, unfocusedTextColor = White,\n                                focusedBorderColor = Red, unfocusedBorderColor = RedDark,\n                                focusedLabelColor = Red, unfocusedLabelColor = Muted,\n                                cursorColor = Red\n                            )\n                        )\n                        Text(\"KG • Puoi inserire anche valori decimali\", color = Red, fontSize = 10.sp)\n                    }\n                },\n                confirmButton = {\n                    TextButton(onClick = {\n                        val normalized = weightInput.trim().replace(',', '.')\n                        val key = \"weight_${day}_${selected}_${chosenSet}\"\n                        if (normalized.isBlank()) prefs.edit().remove(key).apply()\n                        else prefs.edit().putString(key, normalized).apply()\n                        weightDialogSet = -1\n                    }) { Text(\"SALVA\", color = Red, fontWeight = FontWeight.Black) }\n                },\n                dismissButton = { TextButton(onClick = { weightDialogSet = -1 }) { Text(\"ANNULLA\", color = Muted) } },\n                containerColor = Panel,\n                titleContentColor = White,\n                textContentColor = White\n            )\n        }\n        if (timerActive && seconds > 0) {"
          if s.count(old_after) != 1:
              raise SystemExit("Could not locate timer block")
          s = s.replace(old_after, new_after)

          source.write_text(s)
          print("Added direct manual kg entry with decimals for each individual set")
          PY

      - name: Fix workout set list inside scrolling screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8")
          old = '        LazyColumn(Modifier.weight(1f, fill = false), verticalArrangement = Arrangement.spacedBy(7.dp)) {\n            itemsIndexed((0 until ex.sets).toList()) { s, _ ->'
          new = '        Column(verticalArrangement = Arrangement.spacedBy(7.dp)) {\n            (0 until ex.sets).forEach { s ->'
          if s.count(old) != 1:
              raise SystemExit("Elenco serie non individuato esattamente una volta: nessuna modifica applicata")
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Elenco serie convertito in Column: tutte le righe sono misurate correttamente nel contenitore verticale scorrevole.")
          PY

      - name: Add PESI screen
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          s = p.read_text()
          old = '                    "STORICO" -> HistoryScreen(history, { history = ""; prefs.edit().remove("history").apply() })'
          if s.count(old) != 1:
              raise SystemExit("STORICO route not found uniquely")
          s = s.replace(old, old + '\n                    "PESI" -> WeightsScreen(day, prefs)', 1)
          s += """

          @Composable
          private fun WeightsScreen(day: String, prefs: android.content.SharedPreferences) {
              var d by remember(day) { mutableStateOf(day) }
              var editKey by remember { mutableStateOf<String?>(null) }
              var manual by remember { mutableStateOf("") }
              Column(Modifier.fillMaxWidth().weight(1f, fill = false)) {
                  Text("PESI", color = White, fontSize = 22.sp, fontWeight = FontWeight.Black)
                  Text("GESTISCI I TUOI CARICHI", color = Red, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(12.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                      listOf("A", "B", "C").forEach { x ->
                          Button(onClick = { d = x }, modifier = Modifier.weight(1f),
                              colors = ButtonDefaults.buttonColors(containerColor = if (d == x) Red else Panel2)) {
                              Text("GIORNO $x", color = White)
                          }
                      }
                  }
                  Spacer(Modifier.height(10.dp))
                  LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(7.dp)) {
