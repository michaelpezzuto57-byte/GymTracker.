
name: Build Gym Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
       run: unzip -o GymTrackerNative_Updated.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f -name settings.gradle.kts | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Fix Java and Kotlin versions
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          file = project / "app" / "build.gradle.kts"
          content = file.read_text()

          marker = "    buildFeatures { compose = true }"

          replacement = """    compileOptions {
              sourceCompatibility = JavaVersion.VERSION_17
              targetCompatibility = JavaVersion.VERSION_17
          }
          kotlinOptions {
              jvmTarget = "17"
          }
          buildFeatures { compose = true }"""

          if marker not in content:
              raise SystemExit("Impossibile trovare il punto da modificare")

          file.write_text(content.replace(marker, replacement, 1))
          print("Java e Kotlin configurati su JVM 17")
          PY

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gym-Tracker-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
