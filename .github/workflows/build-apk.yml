
name: Build Gym Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: unzip -o GymTrackerNative.zip -d extracted

      - name: Show extracted files
        run: find extracted -maxdepth 3 -type f | head -80

      - name: Build APK
        run: |
          cd extracted
          gradle assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gym-Tracker-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
