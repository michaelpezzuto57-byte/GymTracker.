      - name: Create numbered exercise photo contact sheet
        run: |
          python3 -m venv "$RUNNER_TEMP/photo-venv"
          "$RUNNER_TEMP/photo-venv/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/photo-venv/bin/python" - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps, ImageDraw
          import re
          src = Path("project/GymTrackerNative/app/src/main/res/drawable-nodpi")
          files = sorted(src.glob("exercise_*.jpg"), key=lambda p: int(re.search(r"(\d+)", p.stem).group(1)))
          if len(files) != 27:
              raise SystemExit(f"Attese 27 foto, trovate {len(files)}")
          cell_w, cell_h, label_h = 240, 190, 34
          sheet = Image.new("RGB", (cell_w * 3, (cell_h + label_h) * 9), "#171717")
          draw = ImageDraw.Draw(sheet)
          for i, path in enumerate(files):
              im = Image.open(path).convert("RGB")
              im = ImageOps.fit(im, (cell_w, cell_h))
              x, y = (i % 3) * cell_w, (i // 3) * (cell_h + label_h)
              sheet.paste(im, (x, y))
              draw.text((x + 8, y + cell_h + 8), f"EXERCISE {i+1:02d}", fill="white")
          out = Path("exercise-photo-contact-sheet.jpg")
          sheet.save(out, quality=92)
          print(f"Creato {out}")
          PY
