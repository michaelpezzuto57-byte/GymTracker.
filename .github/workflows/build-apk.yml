          @Composable
          fun FirebaseAuthGate(activity: Activity, appContent: @Composable () -> Unit) {
              val auth = remember { FirebaseAuth.getInstance() }
              var user by remember { mutableStateOf(auth.currentUser) }
              var email by remember { mutableStateOf("") }
