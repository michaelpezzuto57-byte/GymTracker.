
name: Build Gym Tracker APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -o GymTrackerNative.zip -d project

      - name: Find Android project
        run: |
          PROJECT_DIR=$(dirname "$(find project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Configure Java and Kotlin targets
        run: |
          cat > "$RUNNER_TEMP/jvm-fix.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }
              tasks.configureEach {
                  if (it.class.name.contains('KotlinCompile')) {
                      it.kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          EOF

      - name: Build APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -I "$RUNNER_TEMP/jvm-fix.gradle" -p "$PROJECT_DIR" assembleDebug
          else
            gradle -I "$RUNNER_TEMP/jvm-fix.gradle" -p "$PROJECT_DIR" assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gym-Tracker-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
