          (pkg / "CloudSync.kt").write_text(r'''package it.gymtracker.app

          import android.content.Context
          import android.content.SharedPreferences
          import com.google.firebase.firestore.FieldValue
          import com.google.firebase.firestore.FirebaseFirestore

          object CloudSync {
              private var activeUid: String? = null
              private var listener: SharedPreferences.OnSharedPreferenceChangeListener? = null

              @Synchronized
              fun start(context: Context, uid: String) {
                  if (activeUid == uid && listener != null) return
                  val prefs = context.getSharedPreferences("gym_tracker", Context.MODE_PRIVATE)
                  listener?.let { prefs.unregisterOnSharedPreferenceChangeListener(it) }
                  activeUid = uid
                  val document = FirebaseFirestore.getInstance()
                      .collection("users").document(uid).collection("backup").document("workout")
                  document.get().addOnSuccessListener { snapshot ->
                      if (activeUid != uid) return@addOnSuccessListener
                      if (snapshot.exists()) {
                          val data = snapshot.data ?: emptyMap<String, Any>()
                          val editor = prefs.edit()
                          data.forEach { (key, value) ->
                              if (key == "updatedAt") return@forEach
                              when (value) {
                                  is String -> editor.putString(key, value)
                                  is Boolean -> editor.putBoolean(key, value)
                                  is Int -> editor.putInt(key, value)
                                  is Long -> editor.putLong(key, value)
                                  is Double -> editor.putFloat(key, value.toFloat())
                                  is Float -> editor.putFloat(key, value)
                                  is List<*> -> editor.putStringSet(key, value.filterIsInstance<String>().toSet())
                              }
                          }
                          editor.apply()
                      } else {
                          upload(prefs, document)
                      }
                      val changeListener = SharedPreferences.OnSharedPreferenceChangeListener { changed, _ ->
                          if (activeUid == uid) upload(changed, document)
                      }
                      listener = changeListener
                      prefs.registerOnSharedPreferenceChangeListener(changeListener)
                  }
              }

              private fun upload(prefs: SharedPreferences, document: com.google.firebase.firestore.DocumentReference) {
                  val data = mutableMapOf<String, Any>()
                  prefs.all.forEach { (key, value) ->
                      when (value) {
                          is String, is Boolean, is Int, is Long, is Double, is Float -> data[key] = value
                          is Set<*> -> data[key] = value.filterIsInstance<String>().toList()
                      }
                  }
                  data["updatedAt"] = FieldValue.serverTimestamp()
                  document.set(data)
              }
          }
          ''')
          print("Added Firebase email/password + Google login gate and per-user Firestore backup sync")
          PY

