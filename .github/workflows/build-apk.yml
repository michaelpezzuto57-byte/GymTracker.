          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8")

          route_anchor = '                    "PESI" -> WeightsScreen(day, prefs)'
          routes = '''                    "STATISTICHE" -> StatsScreen(history)
                              "CALENDARIO" -> CalendarScreen(prefs)
                              "RECORD" -> RecordsScreen(prefs)'''
          if '"STATISTICHE" -> StatsScreen(history)' not in s:
              if s.count(route_anchor) != 1:
                  raise SystemExit("PESI route not found for progress screens")
              s = s.replace(route_anchor, route_anchor + "\n" + routes, 1)

          if 'val dateKey = java.text.SimpleDateFormat' not in s:
              anchor = '                        if (finish) {'
              date_code = '''                        if (finish) {
                                      val dateKey = java.text.SimpleDateFormat("yyyy-MM-dd", java.util.Locale.getDefault()).format(java.util.Date())
                                      val dates = prefs.getStringSet("workout_dates", emptySet())?.toMutableSet() ?: mutableSetOf()
                                      dates.add(dateKey)
                                      prefs.edit().putStringSet("workout_dates", dates).apply()'''
              if s.count(anchor) != 1:
                  raise SystemExit("Workout finish block not found uniquely")
              s = s.replace(anchor, date_code, 1)

          screens = r'''@Composable
          private fun StatsScreen(history: String) {
              val sessions = history.lines().filter { it.isNotBlank() }
              val completedSets = sessions.sumOf { line ->
                  Regex("(\\d+)/(\\d+) serie").find(line)?.groupValues?.get(1)?.toIntOrNull() ?: 0
              }
              Column(Modifier.fillMaxWidth().padding(4.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                  Text("STATISTICHE", color = White, fontSize = 22.sp, fontWeight = FontWeight.Black)
                  Text("IL TUO ANDAMENTO", color = Red, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  listOf("ALLENAMENTI COMPLETATI" to sessions.size.toString(), "SERIE COMPLETATE" to completedSets.toString()).forEach { (label, value) ->
                      Column(Modifier.fillMaxWidth().background(Panel).border(1.dp, RedDark, RoundedCornerShape(14.dp)).padding(16.dp)) {
                          Text(label, color = Muted, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                          Text(value, color = Red, fontSize = 30.sp, fontWeight = FontWeight.Black)
                      }
                  }
              }
          }

          @Composable
          private fun CalendarScreen(prefs: android.content.SharedPreferences) {
              val trained = prefs.getStringSet("workout_dates", emptySet()) ?: emptySet()
              val month = java.time.YearMonth.now()
              val offset = month.atDay(1).dayOfWeek.value - 1
              val cells = List(offset) { 0 } + (1..month.lengthOfMonth()).toList()
              Column(Modifier.fillMaxWidth().padding(4.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                  Text("CALENDARIO", color = White, fontSize = 22.sp, fontWeight = FontWeight.Black)
                  Text(month.month.name + " " + month.year, color = Red, fontWeight = FontWeight.Bold)
                  Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                      listOf("L", "M", "M", "G", "V", "S", "D").forEach {
                          Text(it, color = Muted, modifier = Modifier.weight(1f), textAlign = androidx.compose.ui.text.style.TextAlign.Center)
                      }
                  }
                  cells.chunked(7).forEach { week ->
                      Row(horizontalArrangement = Arrangement.spacedBy(4.dp)) {
                          week.forEach { day ->
                              val key = if (day == 0) "" else month.atDay(day).toString()
                              val done = key.isNotEmpty() && key in trained
                              Box(Modifier.weight(1f).height(40.dp).clip(RoundedCornerShape(8.dp))
                                  .background(if (done) Color(0xFF3A0A10) else Panel)
                                  .border(1.dp, if (done) Red else RedDark, RoundedCornerShape(8.dp)),
                                  contentAlignment = Alignment.Center) {
                                  if (day > 0) Text(day.toString(), color = if (done) Red else White, fontWeight = if (done) FontWeight.Black else FontWeight.Normal)
                              }
                          }
                          repeat(7 - week.size) { Spacer(Modifier.weight(1f)) }
                      }
                  }
                  Text("I giorni rossi indicano un allenamento completato.", color = Muted, fontSize = 11.sp)
              }
          }

          @Composable
          private fun RecordsScreen(prefs: android.content.SharedPreferences) {
              val exercises = routines.values.flatten().map { it.name.replace("*", "") }.distinct()
              Column(Modifier.fillMaxWidth().padding(4.dp), verticalArrangement = Arrangement.spacedBy(8.dp)) {
                  Text("RECORD PERSONALI", color = White, fontSize = 22.sp, fontWeight = FontWeight.Black)
                  Text("INSERISCI IL TUO MIGLIOR CARICO", color = Red, fontSize = 10.sp, fontWeight = FontWeight.Bold)
                  exercises.forEach { exercise ->
                      val key = "personal_record_" + exercise.hashCode()
                      var value by remember(exercise) { mutableStateOf(prefs.getString(key, "") ?: "") }
                      Row(Modifier.fillMaxWidth().background(Panel).border(1.dp, RedDark, RoundedCornerShape(10.dp)).padding(10.dp),
                          verticalAlignment = Alignment.CenterVertically) {
                          Text(exercise, color = White, fontSize = 12.sp, modifier = Modifier.weight(1f))
                          androidx.compose.foundation.text.BasicTextField(
                              value = value,
                              onValueChange = { next ->
                                  value = next.filter { it.isDigit() || it == ',' || it == '.' }
                                  prefs.edit().putString(key, value).apply()
                              },
                              textStyle = androidx.compose.ui.text.TextStyle(color = Red, fontSize = 15.sp, fontWeight = FontWeight.Bold),
                              modifier = Modifier.width(64.dp)
                          )
                          Text(" kg", color = Muted, fontSize = 10.sp)
                      }
                  }
                  Text("I valori vengono salvati automaticamente.", color = Muted, fontSize = 11.sp)
              }
          }

          '''
          if "private fun StatsScreen" not in s:
              anchor = "@Composable\nprivate fun Header(onMenuClick: () -> Unit)"
              if s.count(anchor) != 1:
                  raise SystemExit("Header insertion point not found for progress screens")
              s = s.replace(anchor, screens + anchor, 1)

          p.write_text(s, encoding="utf-8")
          print("Statistiche, calendario e record personali inseriti")
          PY

      - name: Remove unused bottom spacer and lock header
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8")
          # The header stays outside the scroll container. The selected screen
          # occupies the remaining height and scrolls; the bottom navigation
          # stays anchored without a second weighted spacer creating a black void.
          # Remove a weighted spacer only when the next non-empty line is BottomNav.
          lines = s.splitlines(keepends=True)
          removed = False
          for i, line in enumerate(lines):
              if "Spacer(Modifier.weight(1f))" not in line:
                  continue
              j = i + 1
              while j < len(lines) and not lines[j].strip():
                  j += 1
              if j < len(lines) and "BottomNav(tab)" in lines[j]:
                  del lines[i]
                  removed = True
                  break
          if removed:
              s = "".join(lines)
              print("Removed redundant spacer before BottomNav")
          else:
              print("No redundant spacer immediately before BottomNav; continuing safely")
          scroll_anchor = "Column(Modifier.weight(1f).fillMaxWidth().verticalScroll(rememberScrollState()))"
          if s.count(scroll_anchor) != 1:
              raise SystemExit("Scrollable content container not found uniquely")
          if "Header { drawerOpen = true }" not in s:
              raise SystemExit("Fixed header/menu call not found")
          p.write_text(s, encoding="utf-8")
          print("Removed the redundant black bottom gap; header remains fixed and screen content scrolls.")
          PY

      - name: Enforce fixed header and real vertical scrolling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, re
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/it/gymtracker/app/MainActivity.kt"
          s = p.read_text(encoding="utf-8")

          # Ensure the Compose scrolling APIs are imported.
          extra_imports = [
              "import androidx.compose.foundation.gestures.detectHorizontalDragGestures",
              "import androidx.compose.ui.input.pointer.pointerInput",
          ]
          for imp in extra_imports:
              if imp not in s:
                  anchor = "import androidx.compose.foundation.layout.*"
                  if anchor not in s: raise SystemExit("Import Compose non trovato")
                  s = s.replace(anchor, anchor + chr(10) + imp, 1)
          for name in ("verticalScroll", "rememberScrollState"):
              imp = "import androidx.compose.foundation." + name
              if imp not in s:
                  anchor = "import androidx.compose.foundation.layout.*"
                  if anchor in s:
                      s = s.replace(anchor, anchor + "\n" + imp, 1)
                  else:
                      raise SystemExit("Import layout Compose non trovato: impossibile attivare lo scroll")

          # Find Header with brace matching, regardless of whether an earlier patch
          # already changed its signature.
          # Function-type parameters contain nested parentheses; locate the
          # declaration first, then find its body brace.
          start = s.find("private fun Header")
          if start < 0:
              raise SystemExit("Dichiarazione private fun Header non trovata")
          brace = s.find("{", start)
          if brace < 0:
              raise SystemExit("Inizio del corpo Header non trovato")
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == "{": depth += 1
              elif s[i] == "}":
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit("Blocco Header non chiuso")
          header = s[start:end]
          header = "private fun Header(onMenuClick: () -> Unit) {" + header[header.find("{") + 1:]
          # Remove old model/vehicle branding from the header.
          header = re.sub(r'^\s*Text\("(?:RS4|125)"[^\n]*\)\s*\n?', "", header, flags=re.M)
          if "onClick = onMenuClick" not in header:
              anchor = "Column(Modifier.weight(1f)) {"
              if header.count(anchor) != 1:
                  raise SystemExit("Colonna logo Header non individuata in modo univoco")
              header = header.replace(anchor,
                  'TextButton(onClick = onMenuClick, modifier = Modifier.size(44.dp)) { Text("☰", color = Red, fontSize = 27.sp) }\n        Spacer(Modifier.width(8.dp))\n        ' + anchor, 1)
          s = s[:start] + header + s[end:]

          # Keep the header and bottom navigation outside the scroll container.
          scroll = "Column(Modifier.weight(1f).fillMaxWidth().verticalScroll(rememberScrollState()))"
          swipe = """.pointerInput(tab) {
                  var drag = 0f
                  detectHorizontalDragGestures(
                      onHorizontalDrag = { change, amount -> change.consume(); drag += amount },
                      onDragEnd = {
                          val pages = listOf("HOME", "PESI", "STORICO", "STATISTICHE", "CALENDARIO", "RECORD", "PROFILE")
                          val index = pages.indexOf(tab)
                          if (index >= 0 && drag < -70f && index < pages.lastIndex) tab = pages[index + 1]
                          else if (index > 0 && drag > 70f) tab = pages[index - 1]
                          drag = 0f
                      }
                  )
              }"""
          if scroll not in s: raise SystemExit("Area scorrevole centrale non trovata")
          # Attach the gesture modifier to the Modifier chain, before closing Column(...).
          s = s.replace(scroll, scroll[:-1] + swipe + ")", 1)
          updated_scroll = scroll[:-1] + swipe + ")"
          if s.count(updated_scroll) != 1:
              raise SystemExit("Contenitore scorrevole con gesto orizzontale non presente o duplicato")
          if "Header { drawerOpen = true }" not in s:
              raise SystemExit("Pulsante menu non collegato allo stato del menu")
          p.write_text(s, encoding="utf-8")
          print("Header fissato, pulsante menu a sinistra verificato, contenuto centrale con verticalScroll.")
          PY

